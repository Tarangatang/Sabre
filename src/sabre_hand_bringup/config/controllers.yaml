controller_manager:
  ros__parameters:
    update_rate: 250

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    hand_controller:
      type: joint_trajectory_controller/JointTrajectoryController

hand_controller:
  ros__parameters:
    joints:
      - thumb_joint_1
      - thumb_joint_2
      - thumb_joint_3
      - index_joint_1
      - index_joint_2
      - index_joint_3
      - middle_joint_1
      - middle_joint_2
      - middle_joint_3
      - ring_joint_1
      - ring_joint_2
      - ring_joint_3
      - little_joint_1
      - little_joint_2
      - little_joint_3
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 1.0

